[package]
name = "mentat"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
memmap2 = "0.9.10"
rayon = "1.12.0"
safetensors = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = "2.9.6"
dirs = "5.0.1"
chrono = "0.4.38"

cudarc = { version = "0.11.0", optional = true, features = ["nvrtc"] }
metal = { version = "0.29.0", optional = true }
objc = { version = "0.2.7", optional = true }
dhat = { version = "0.3.3", optional = true }

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "tensor_bench"
harness = false

[features]
default = []
cuda = ["dep:cudarc"]
metal = ["dep:metal", "dep:objc"]
dhat-heap = ["dep:dhat"]
